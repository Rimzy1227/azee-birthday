<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Reveal</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="page2">
    <button class="music-toggle" type="button" aria-label="Toggle music">♫</button>

    <main class="page-shell page-quiet">
      <div class="starfield" aria-hidden="true"></div>
      <div class="sparkles" aria-hidden="true"></div>
      <div class="floating-balloons" aria-hidden="true"></div>
      <div class="confetti-container" aria-hidden="true"></div>

      <div class="progress-indicator" aria-label="Page progress"></div>

      <div class="page container">
        <section class="hero-panel" aria-label="Birthday reveal">
          <div class="secret-copy">
            <div class="kicker">The reveal</div>
            <h2>HAPPY BIRTHDAY AZEE! 🎂</h2>
            <p class="script-text">To one of the most wonderful people I know.</p>
            <p class="lead">Some people enter our lives and simply become part of the story. Not because of grand moments, but because their presence makes ordinary moments better.</p>

            <div class="birthday-scene">
              <div class="cake-wrap">
                <div class="cake-banner" aria-hidden="true"><span>Happy Birthday</span><b>AZEE!</b></div>
                <div class="cake" aria-label="Click the cake to make a wish" tabindex="0" role="button">
                  <span class="candle" style="left: 27%;"><i class="flame"></i><i class="smoke"></i></span>
                  <span class="candle" style="left: 38%;"><i class="flame"></i><i class="smoke"></i></span>
                  <span class="candle" style="left: 49%;"><i class="flame"></i><i class="smoke"></i></span>
                  <span class="candle" style="left: 60%;"><i class="flame"></i><i class="smoke"></i></span>
                  <span class="candle" style="left: 71%;"><i class="flame"></i><i class="smoke"></i></span>
                  <span class="cake-top"></span>
                  <span class="cake-middle"></span>
                  <span class="cake-base"></span>
                  <span class="cake-sprinkles" aria-hidden="true"></span>
                  <span class="cake-garnish" aria-hidden="true">
                    <i class="berry berry-one"></i><i class="berry berry-two"></i>
                    <i class="pearl pearl-one"></i><i class="pearl pearl-two"></i><i class="pearl pearl-three"></i>
                    <i class="pearl pearl-four"></i><i class="pearl pearl-five"></i>
                  </span>
                </div>
                <div class="cake-plate" aria-hidden="true"></div>
              </div>
            </div>

            <p class="lead" data-cake-message style="margin-top: 1.5rem; opacity: 0.95;">Make a wish... ✨</p>

            <div class="cta-row">
              <a class="primary-btn" href="page3.html">There's More →</a>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="js/script.js?v=decorations5"></script>
  </body>
</html>
