<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A scrapbook birthday card for Azee</title>
  <desc id="desc">A handmade black paper friendship scrapbook spread with kraft paper, white ink doodles, and a Friends Forever message.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <pattern id="paper" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#bd8551"/>
      <path d="M0 4L14 1M-2 13L8 10" stroke="#d9a572" stroke-opacity=".24" stroke-width="2"/>
    </pattern>
    <pattern id="blackPaper" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#17171a"/>
      <circle cx="3" cy="5" r=".8" fill="#fff" opacity=".08"/><circle cx="14" cy="13" r=".7" fill="#fff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" rx="22" fill="#d8d2c5"/>
  <path d="M40 76C160 35 270 70 380 42M875 54c110-32 185-18 280 20" fill="none" stroke="#b29b72" stroke-width="5" opacity=".4"/>
  <rect x="28" y="32" width="1144" height="690" rx="10" fill="#09090b" filter="url(#shadow)"/>
  <rect x="45" y="48" width="1110" height="658" rx="5" fill="url(#blackPaper)"/>
  <path d="M600 48v658" stroke="#393238" stroke-width="3"/>

  <g transform="translate(78 130) rotate(-4)" filter="url(#shadow)">
    <path d="M0 0h330l-10 458H-7z" fill="url(#paper)"/>
    <path d="M15 35h210v168H15z" fill="#28252a" stroke="#eee5d8" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="101" y="35" width="34" height="168" fill="#cbd0d0" opacity=".9"/>
    <rect x="15" y="101" width="210" height="34" fill="#d5d7d6" opacity=".9"/>
    <path d="M120 90c-39-45-77 17 0 68 77-51 39-113 0-68z" fill="#ae6c51" stroke="#f6d1ae" stroke-width="4"/>
    <path d="M32 235c38 14 74 17 110 8 42-11 72-10 116 12M32 264c42 13 92 19 154 5 28-6 47-3 73 8M32 298c51 15 100 11 159 1 28-5 52 0 70 8M32 333c46 12 98 12 141 2 31-8 54-5 86 9" fill="none" stroke="#fff" stroke-width="3" opacity=".85"/>
    <text x="30" y="390" fill="#fff" font-size="22" font-family="cursive" transform="rotate(-2 30 390)">For Azee, with all</text>
    <text x="30" y="420" fill="#fff" font-size="22" font-family="cursive">the little moments</text>
    <path d="M250 282l25 22 42-62" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M250 350q28-32 54 0-27 27-54 0z" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M42 446q20-24 40 0-20 20-40 0z" fill="none" stroke="#fff" stroke-width="3"/>
  </g>

  <g transform="translate(670 98) rotate(3)">
    <text x="0" y="0" fill="#fff" font-size="78" font-family="cursive" font-style="italic" font-weight="bold">Friends</text>
    <text x="40" y="78" fill="#fff" font-size="78" font-family="cursive" font-style="italic" font-weight="bold">Forever</text>
    <path d="M25 94q116 23 250-3" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M280 20q18-38 35 0 29-16 22 15-12 33-29 47-19-16-28-45-7-28 20-17z" fill="none" stroke="#e6a96f" stroke-width="4"/>
  </g>

  <g transform="translate(650 270) rotate(-5)" filter="url(#shadow)">
    <path d="M0 25L30 0h305l24 25-22 235H22z" fill="url(#paper)"/>
    <text x="37" y="82" fill="#fff" font-size="25" font-family="cursive">Together we make</text>
    <text x="37" y="119" fill="#fff" font-size="25" font-family="cursive">the good times better</text>
    <text x="37" y="156" fill="#fff" font-size="25" font-family="cursive">and the hard times easier.</text>
    <path d="M250 188c-26-33-59 13 0 58 59-45 26-91 0-58z" fill="none" stroke="#fff" stroke-width="4"/>
  </g>

  <g transform="translate(790 525) rotate(6)" filter="url(#shadow)">
    <rect width="220" height="130" fill="#f0e7d8"/>
    <rect x="14" y="14" width="192" height="88" fill="#b7a28c"/>
    <circle cx="78" cy="52" r="24" fill="#302d37"/><circle cx="132" cy="52" r="24" fill="#302d37"/>
    <path d="M53 86q53 27 106 0" fill="none" stroke="#302d37" stroke-width="7"/>
    <text x="34" y="119" fill="#514238" font-size="16" font-family="cursive">our kind of magic</text>
  </g>

  <g fill="none" stroke="#fff" stroke-width="3" opacity=".9">
    <path d="M492 138l8 20 21 2-16 14 5 21-18-11-19 11 6-21-16-14 21-2z"/>
    <path d="M480 560q32-55 64 0-32 39-64 0zM512 505v110"/>
    <path d="M1020 165q25-28 50 0-25 26-50 0z"/>
    <path d="M1040 550q18-30 36 0-18 18-36 0z"/>
    <path d="M380 600l25-25m-12 25-25-25"/>
  </g>
  <g fill="#fff" font-family="cursive" font-size="22">
    <text x="360" y="105">made with friendship</text>
    <text x="390" y="670">Happy Birthday, Azeeka</text>
    <text x="790" y="690">To Azee — keep being you.</text>
  </g>
  <path d="M1030 0c-15 80-8 145 30 190" fill="none" stroke="#754c39" stroke-width="12"/>
  <path d="M1015 0c-12 64-10 114 23 170" fill="none" stroke="#c6a05b" stroke-width="3"/>
  <path d="M1024 168q20 30 43 0-20 62-43 0z" fill="#79513d"/>
</svg>
